<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini SIEM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #0f1419; }
    .card { background: #161c24; border-color: #263040; }
    .stat { font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .sev-critical { background: #b02a37; } .sev-high { background: #dc6b19; }
    .sev-medium { background: #b8860b; } .sev-low { background: #2f6f9f; } .sev-info { background: #4a5563; }
    td.raw, pre.evidence { font-family: ui-monospace, monospace; font-size: .8rem; white-space: pre-wrap; word-break: break-all; }
    .table { --bs-table-bg: transparent; }
    tr.alert-row { cursor: pointer; }
    .chart-box { position: relative; height: 240px; }
  </style>
</head>
<body>
<nav class="navbar border-bottom border-secondary-subtle px-3">
  <span class="navbar-brand fw-semibold">Mini SIEM</span>
  <span class="text-secondary small" id="status">connecting…</span>
</nav>

<main class="container-fluid p-3">
  <div class="row g-3 mb-3">
    <div class="col-6 col-lg-3"><div class="card p-3"><div class="text-secondary small">Total events</div><div class="stat" id="s-events">–</div></div></div>
    <div class="col-6 col-lg-3"><div class="card p-3"><div class="text-secondary small">Total alerts</div><div class="stat" id="s-alerts">–</div></div></div>
    <div class="col-6 col-lg-3"><div class="card p-3"><div class="text-secondary small">Critical alerts</div><div class="stat text-danger" id="s-critical">–</div></div></div>
    <div class="col-6 col-lg-3"><div class="card p-3"><div class="text-secondary small">High severity alerts</div><div class="stat text-warning" id="s-high">–</div></div></div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-lg-6"><div class="card p-3"><h6>Event timeline (per minute)</h6><div class="chart-box"><canvas id="c-timeline"></canvas></div></div></div>
    <div class="col-lg-3"><div class="card p-3"><h6>Attack types</h6><div class="chart-box"><canvas id="c-types"></canvas></div></div></div>
    <div class="col-lg-3"><div class="card p-3"><h6>Most active IPs</h6><div class="chart-box"><canvas id="c-ips"></canvas></div></div></div>
  </div>

  <div class="card p-3 mb-3">
    <form class="row g-2 align-items-end" id="filters">
      <div class="col-6 col-md-2"><label class="form-label small" for="f-severity">Severity</label>
        <select class="form-select form-select-sm" id="f-severity"><option value="">any</option>
          <option>critical</option><option>high</option><option>medium</option><option>low</option><option>info</option></select></div>
      <div class="col-6 col-md-3"><label class="form-label small" for="f-type">Event type</label>
        <select class="form-select form-select-sm" id="f-type"><option value="">any</option>
          <option>auth_failure</option><option>auth_success</option><option>auth_invalid_user</option>
          <option>sudo_failure</option><option>sudo_command</option><option>http_request</option>
          <option>firewall_block</option><option>firewall_allow</option></select></div>
      <div class="col-6 col-md-3"><label class="form-label small" for="f-ip">IP address</label>
        <input class="form-control form-control-sm" id="f-ip" placeholder="e.g. 203.0.113.50"></div>
      <div class="col-6 col-md-2"><label class="form-label small" for="f-period">Time period</label>
        <select class="form-select form-select-sm" id="f-period"><option value="">all time</option>
          <option value="15">last 15 min</option><option value="60">last hour</option>
          <option value="1440">last 24 h</option><option value="10080">last 7 days</option></select></div>
      <div class="col-12 col-md-2"><button class="btn btn-sm btn-outline-light w-100" type="reset">Clear</button></div>
    </form>
  </div>

  <div class="card p-3 mb-3">
    <h6>Alerts <span class="text-secondary small">(click a row for evidence)</span></h6>
    <div class="table-responsive"><table class="table table-sm table-hover align-middle mb-0">
      <thead><tr><th>Time (UTC)</th><th>Severity</th><th>Type</th><th>Source</th><th>Host</th><th>ATT&amp;CK</th><th>Description</th></tr></thead>
      <tbody id="t-alerts"></tbody></table></div>
  </div>

  <div class="card p-3">
    <h6>Recent security events</h6>
    <div class="table-responsive"><table class="table table-sm align-middle mb-0">
      <thead><tr><th>Time (UTC)</th><th>Type</th><th>Source IP</th><th>User</th><th>Status</th><th>Host</th><th>Raw</th></tr></thead>
      <tbody id="t-events"></tbody></table></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
